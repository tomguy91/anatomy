.fc .iso-plate {
  padding: 46px 20px 66px;
  overflow: hidden;
}

.fc-stage {
  position: relative;
  border-radius: 8px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  will-change: transform;
}

.fc-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.fc-stage > svg,
.fc-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.fc-aero-back,
.fc-front,
.fc-fx-front {
  position: absolute;
  inset: 0;
  height: 100% !important;
}

.fc-aero-back,
.fc-fx-front {
  pointer-events: none;
  mix-blend-mode: var(--fc-blend);
}

.fc-front {
  pointer-events: none;
  overflow: visible;
}

.fc-front .it {
  pointer-events: visiblePainted;
  cursor: pointer;
}

.fc-front .it[data-piece="stand"] {
  cursor: default;
}

.fc-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}

.fc-stage[data-focus] .it[data-piece="stand"] {
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-shade {
  stroke: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-top {
  stroke: var(--anatomy-lit-top);
}

.fc-controls {
  position: absolute;
  left: 20px;
  bottom: 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  font-family: var(--anatomy-mono);
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.fc-btns {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.fc-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 11px 0 9px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--fc-btn-ring);
  transition: background 180ms var(--anatomy-ease), transform 140ms var(--anatomy-ease), color 180ms var(--anatomy-ease);
}

.fc-btn:hover {
  background: var(--fc-btn-hover);
}

.fc-btn:active {
  transform: scale(0.97);
}

.fc-btn:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 2px;
}

.fc-lamp {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--fc-lamp-off);
  transition: background 220ms var(--anatomy-ease), box-shadow 220ms var(--anatomy-ease);
}

.fc-btn[data-kind="run"][data-on] .fc-lamp {
  background: var(--fc-lamp-run);
  box-shadow: 0 0 8px 1.5px var(--fc-lamp-run-glow);
}

.fc-btn[data-kind="drs"][data-on] .fc-lamp {
  background: var(--fc-lamp-drs);
  box-shadow: 0 0 8px 1.5px var(--fc-lamp-drs-glow);
}

.fc-btn[data-kind="brake"][data-on] .fc-lamp {
  background: var(--fc-lamp-brake);
  box-shadow: 0 0 9px 2px var(--fc-lamp-brake-glow);
}

.fc-btn[data-kind="explode"][data-on] .fc-lamp,
.fc-btn[data-kind="steer"][data-on] .fc-lamp {
  background: var(--fc-lamp-exp);
  box-shadow: 0 0 7px 1px var(--fc-lamp-exp-glow);
}

.fc-slider-wrap {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--anatomy-face);
  box-shadow: inset 0 0 0 1px var(--fc-btn-ring);
  color: var(--anatomy-text);
}

.fc-slider {
  width: 74px;
  height: 3px;
  accent-color: var(--anatomy-hi);
  cursor: pointer;
}

.fc-hint {
  color: var(--anatomy-muted);
  font-size: 9.5px;
  white-space: nowrap;
}

.fc-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;

    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];

// Pure physics model for a modern FIA single-seater Formula racing car.
// Shared between build.mjs (static annotations & limits) and live.js (interactive telemetry & motion).

const SPEC = {
  massKg: 798,          // FIA minimum weight without fuel
  g: 9.81,
  rho: 1.225,           // Air density (kg/m^3)
  frontalArea: 1.48,    // m^2
  wheelbaseM: 3.60,     // m (300 world units at 12 mm/unit)
  trackFM: 1.60,
  trackRM: 1.56,
  tyreRadiusM: 0.36,    // 720 mm outer diameter (18-inch rim)
  clBase: 3.45,         // Total downforce coefficient (DRS closed)
  clDrs: 2.98,          // Total downforce coefficient (DRS open)
  cdBase: 0.98,         // Drag coefficient (DRS closed)
  cdDrs: 0.74,          // Drag coefficient (DRS open)
  aeroFrontShareBase: 0.43,
  aeroFrontShareDrs: 0.49,
  staticFrontShare: 0.46,
  kFrontNmm: 290,       // Front wheel rate (N/mm, dual wheel)
  kRearNmm: 245,        // Rear wheel rate (N/mm, dual wheel)
  staticRideFrontMm: 34,
  staticRideRearMm: 62,
  maxSpeedKmh: 332,
  maxSpeedDrsKmh: 348,
  maxPowerKw: 745,      // ~1,000 hp combined (1.6L V6 turbo + 120 kW MGU-K)
  mgukKw: 120,
  redlineRpm: 12500,
  idleRpm: 4200,
  brakeAmbientC: 120,
  brakeMaxC: 1080,
};

function gearForSpeed(kmh) {
  if (kmh < 2) return 0;
  if (kmh < 85) return 1;
  if (kmh < 128) return 2;
  if (kmh < 168) return 3;
  if (kmh < 208) return 4;
  if (kmh < 246) return 5;
  if (kmh < 284) return 6;
  if (kmh < 316) return 7;
  return 8;
}

function rpmForSpeed(kmh) {
  if (kmh < 2) return SPEC.idleRpm;
  const g = gearForSpeed(kmh);
  const tops = [0, 92, 134, 174, 214, 252, 290, 322, 355];
  const lows = [0, 0, 78, 118, 158, 198, 236, 274, 306];
  const frac = Math.min(1, Math.max(0, (kmh - lows[g]) / Math.max(1, tops[g] - lows[g])));
  return Math.round(8600 + frac * (SPEC.redlineRpm - 8600));
}

function telemetry({ speedKmh = 0, drs = 0, brake = 0, steerDeg = 0, brakeTempC = 120 }) {
  const v = Math.max(0, speedKmh) / 3.6;
  const q = 0.5 * SPEC.rho * v * v * SPEC.frontalArea;
  const cl = SPEC.clBase + (SPEC.clDrs - SPEC.clBase) * drs;
  const cd = SPEC.cdBase + (SPEC.cdDrs - SPEC.cdBase) * drs;
  const downforceN = q * cl;
  const dragN = q * cd;

  const aeroFrontShare = SPEC.aeroFrontShareBase + (SPEC.aeroFrontShareDrs - SPEC.aeroFrontShareBase) * drs;
  const downFrontN = downforceN * aeroFrontShare;
  const downRearN = downforceN * (1 - aeroFrontShare);

  // Braking longitudinal deceleration (up to 5.2 G at high aero + full brake)
  const brakeG = brake * Math.min(5.2, 1.8 + 3.4 * (speedKmh / 300));
  // Weight transfer forward under braking: dF = m * a * h_cg / L (h_cg = 0.29 m)
  const transferN = SPEC.massKg * brakeG * SPEC.g * (0.29 / SPEC.wheelbaseM);

  const staticW = SPEC.massKg * SPEC.g;
  const loadFrontN = Math.max(500, staticW * SPEC.staticFrontShare + downFrontN + transferN);
  const loadRearN = Math.max(500, staticW * (1 - SPEC.staticFrontShare) + downRearN - transferN);

  // Suspension squat (mm from static ride height)
  const squatFrontMm = Math.min(20, Math.max(-4, (downFrontN + transferN) / SPEC.kFrontNmm));
  const squatRearMm = Math.min(26, Math.max(-6, (downRearN - transferN) / SPEC.kRearNmm));

  const rideFrontMm = Math.max(12, SPEC.staticRideFrontMm - squatFrontMm);
  const rideRearMm = Math.max(30, SPEC.staticRideRearMm - squatRearMm);

  const gear = gearForSpeed(speedKmh);
  const rpm = rpmForSpeed(speedKmh);
  const mgukOutKw = brake > 0.08 && speedKmh > 35
    ? -Math.round(SPEC.mgukKw * Math.min(1, brake))
    : speedKmh > 40 ? Math.round(SPEC.mgukKw * Math.min(1, speedKmh / 240)) : 0;

  return {
    speedKmh,
    v,
    drs,
    drsGapMm: Math.round(12 + 73 * drs),
    brake,
    brakeG,
    brakeTempC,
    steerDeg,
    downforceKn: downforceN / 1000,
    dragKn: dragN / 1000,
    loadFrontKg: Math.round(loadFrontN / SPEC.g),
    loadRearKg: Math.round(loadRearN / SPEC.g),
    cornerFLKg: Math.round((loadFrontN / SPEC.g) * (0.5 - steerDeg * 0.008)),
    cornerFRKg: Math.round((loadFrontN / SPEC.g) * (0.5 + steerDeg * 0.008)),
    cornerRLKg: Math.round((loadRearN / SPEC.g) * (0.5 - steerDeg * 0.007)),
    cornerRRKg: Math.round((loadRearN / SPEC.g) * (0.5 + steerDeg * 0.007)),
    squatFrontMm,
    squatRearMm,
    rideFrontMm: Math.round(rideFrontMm),
    rideRearMm: Math.round(rideRearMm),
    gear,
    rpm,
    mgukOutKw,
    wheelOmega: v / SPEC.tyreRadiusM,
  };
}

// Shared isometric dynamic-part builders used both at build time (build.mjs)
// and live in the browser (live.js) for zero-drift steering, wheel spin,
// DRS flap articulation, pushrod/rocker motion, and steering-wheel rotation.

function makeDynamicParts(k, G, P, D) {
  const V = G.viewOf(P);
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const Ln = (d, style) => k.lineSvg(d, style);
  const Dots = (points, style) => k.dotsSvg(points, style);

  const rotVec = (v, axis, angle) => {
    const c = Math.cos(angle);
    const s = Math.sin(angle);
    const d = G.dot3(axis, v);
    const x = G.cross3(axis, v);
    return [
      v[0] * c + x[0] * s + axis[0] * d * (1 - c),
      v[1] * c + x[1] * s + axis[1] * d * (1 - c),
      v[2] * c + x[2] * s + axis[2] * d * (1 - c),
    ];
  };

  const rotAround = (p, origin, axis, angle) => G.add3(origin, rotVec(G.sub3(p, origin), axis, angle));

  const signed2 = (poly) =>
    poly.reduce((a, [x, y], i) => {
      const [x2, y2] = poly[(i + 1) % poly.length];
      return a + x * y2 - x2 * y;
    }, 0);
  const orient2 = (pts) => (signed2(pts) < 0 ? [...pts].reverse() : pts);

  function runsBool(flags, want) {
    const n = flags.length;
    const runs = [];
    const start = flags.findIndex((f, i) => f !== flags[(i + n - 1) % n]);
    if (start < 0) return flags[0] === want ? [Array.from({ length: n + 1 }, (_, i) => i % n)] : [];
    let run = null;
    for (let step = 0; step < n; step++) {
      const i = (start + step) % n;
      if (flags[i] === want) {
        if (!run) run = [i];
        run.push((i + 1) % n);
      } else if (run) {
        runs.push(run);
        run = null;
      }
    }
    if (run) runs.push(run);
    return runs;
  }

  function prismPaths(F, poly, s0, s1) {
    const ring = signed2(poly) > 0 ? poly : [...poly].reverse();
    const n = ring.length;
    const W3 = (s, [x, y]) => [
      F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y,
      F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y,
      F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y,
    ];
    const capNear = G.dot3(F.a, V) > 0;
    const [nearS, farS] = capNear ? [s1, s0] : [s0, s1];
    const near = ring.map((p) => at(W3(nearS, p)));
    const far = ring.map((p) => at(W3(farS, p)));
    const normals = ring.map(([x0, y0], i) => {
      const [x1, y1] = ring[(i + 1) % n];
      return G.unit3(G.add3(G.mul3(F.u, y1 - y0), G.mul3(F.v, -(x1 - x0))));
    });
    const facing = normals.map((m) => G.dot3(m, V) > 1e-9);
    const outline = [];
    const crease = [];
    for (const run of runsBool(facing, false)) outline.push(k.pathOf(run.map((i) => near[i])));
    for (const run of runsBool(facing, true)) {
      crease.push(k.pathOf(run.map((i) => near[i])));
      outline.push(k.pathOf(run.map((i) => far[i])));
    }
    for (let i = 0; i < n; i++) if (facing[(i + n - 1) % n] !== facing[i]) outline.push(k.pathOf([near[i], far[i]]));
    const parts = [k.pathOf(orient2(near), true), k.pathOf(orient2(far), true)];
    const buckets = [[], [], [], [], []];
    for (let i = 0; i < n; i++) {
      if (!facing[i]) continue;
      const quad = orient2([near[i], near[(i + 1) % n], far[(i + 1) % n], far[i]]);
      parts.push(k.pathOf(quad, true));
      buckets[G.toneOf(normals[i], P)].push(k.pathOf(quad, true));

    // Left curved shoulder (smooth knots)
    for (let i = 1; i <= 5; i++) {
      const a = (i / 5) * (Math.PI / 2);
      pts.push([-halfW + sh * (1 - Math.cos(a)), rOut - sh + sh * Math.sin(a), 1]);

      pts.push([halfW - sh + sh * Math.sin(a), rOut - sh + sh * Math.cos(a), 1]);

    pts.push([halfW, rRim]);

    const discS1 = -side * 10.2;

        svg: S(G.disc(0, G.len3(vP), 0.78, Fp, P, { steps: 12 }), { tone: "hi" }),
      });

      const Fr = G.frameOf(rockerPivot, [1, 0, 0], [0, 1, 0], [0, 0, 1]);
      const rPoly = [
        [0, 0],
        [side * 3.2, 2.4 + squatFront * 0.4],
        [-side * 2.2, 2.8 - squatFront * 0.3],

        d: G.dot3(rockerPivot, V) + 0.2,

  return { prismPaths, tyreProfile, wheelSvg, frontBrakeCornerSvg, drsFlapSvg, steeringWheelSvg, frontInboardSvg, rotAround, rotVec };
}

function setBtnState(btn, on) {

}

function setApart(on, immediate = false) {
  if (apart === on && !immediate) return;
  apart = on;
  setBtnState(btnExplode, apart);
  const goal = on ? 1 : 0;
  let idx = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    const st = rideState[id];
    if (!st) continue;
    if (immediate || still.matches) {
      st.x = goal;
      st.v = 0;
      st.target = goal;
      st.pending = null;

function stepSpring(st, dt, calm) {
  if (st.pending && clock >= st.pending.at) {
    st.target = st.pending.value;
    st.pending = null;
  }
  if (calm) {
    st.x = st.target;
    st.v = 0;
    return false;
  }
  for (let i = 0; i < SPRING.substeps; i++) {
    const h = dt / SPRING.substeps;
    st.v += ((st.target - st.x) * SPRING.stiffness - st.v * SPRING.damping) * h;
    st.x += st.v * h;

    st.v = 0;
    return st.pending !== null;

  return true;

    float funnel = exp(-pow((p.x + 28.) / 128., 2.));
    float yWarp = p.y * (1. + 0.24 * funnel * smoothstep(70., 12., abs(p.y)));
    float wake = smoothstep(-132., -225., p.x);
    float swirl = wake * sin(p.x * .085 + uTime * (6. + 10. * spd)) * 7.5 * (1. - .35 * uDrs);
    float yTrack = yWarp + swirl * sign(p.y + 1e-4) * exp(-pow((abs(p.y) - 30.) / 34., 2.));

    float lanes = pow(0.5 + 0.5 * cos(yTrack * 0.44), 10.);
    float dash = smoothstep(0.28, 0.86, fbm2(vec2(p.x * 0.022 + uTime * (3.2 + 8.5 * spd), yTrack * 0.07)));
    float underBoost = 0.42 + 0.85 * funnel * exp(-pow(p.y / 66., 2.));
    float wakeBoost = wake * exp(-pow(p.y / (44. + 22. * wake), 2.)) * (0.65 - 0.2 * uDrs);
    float rib = lanes * dash * (underBoost + wakeBoost) * mask * spd * (1. - 0.65 * uExplode);

    // Subtle Venturi low-pressure floor sheen under the car
    float venturiPool = exp(-pow((p.x + 36.) / 108., 2.)) * exp(-pow(p.y / 54., 2.)) * spd * (1. - 0.7 * uExplode) * mask;

    vec3 aeroDark = mix(vec3(.24, .52, .95), vec3(.52, .86, 1.), 0.35 + 0.4 * funnel);
    col += aeroDark * (rib * 0.58 + venturiPool * 0.14);

    vec3 aeroLight = mix(vec3(.12, .34, .68), vec3(.08, .44, .72), funnel);
    float aStream = clamp((rib * 0.48 + venturiPool * 0.10), 0., 0.72);
    lCol += aeroLight * aStream;
    lA += aStream;
  }

  // Floor bounce thermal glow under hot carbon brakes
  if (uBrakeGlow > .01 && mask > .001) {
    float bg = 0.;
    bg += exp(-dot(p.xy - uBrakeFL.xy, p.xy - uBrakeFL.xy) / 680.);
    bg += exp(-dot(p.xy - uBrakeFR.xy, p.xy - uBrakeFR.xy) / 680.);
    bg += exp(-dot(p.xy - uBrakeRL.xy, p.xy - uBrakeRL.xy) / 560.) * 0.75;
    bg += exp(-dot(p.xy - uBrakeRR.xy, p.xy - uBrakeRR.xy) / 560.) * 0.75;
    float glow = bg * uBrakeGlow * mask;
    col += mix(vec3(.95, .24, .06), vec3(1., .56, .18), uBrakeGlow) * glow * 0.46;
    float aB = glow * 0.34;
    lCol += vec3(.84, .26, .06) * aB;
    lA += aB;
  }

  // Subtle floor warm reflection under exhaust exit
  if (uExhaust > .02 && mask > .001) {
    vec2 exP = p.xy - vec2(uTailpipe.x - 22., uTailpipe.y);
    float eg = exp(-pow(exP.x / 36., 2.) - pow(exP.y / 22., 2.)) * uExhaust * mask;
    col += vec3(.95, .44, .14) * eg * 0.22;
    float aE = eg * 0.16;
    lCol += vec3(.78, .32, .08) * aE;
    lA += aE;
  }

  vec3 lNorm = lA > 1e-4 ? lCol / lA : vec3(0.);
  gl_FragColor = paperInk(col, lNorm, lA);
}
`;

const FRONT_FRAG = `
uniform float uSpeed;
uniform float uDrs;
uniform float uBrakeGlow;
uniform float uExhaust;
uniform float uExplode;
uniform float uLight;
uniform vec3 uBrakeFL;
uniform vec3 uBrakeFR;
uniform vec3 uBrakeRL;
uniform vec3 uBrakeRR;
uniform vec3 uTailpipe;
uniform vec3 uRwTipL;
uniform vec3 uRwTipR;

vec3 blackbody(float t){
  // t in [0..1] from 420C cherry red -> 820C orange -> 1060C incandescent white-gold
  vec3 c0 = vec3(.78, .08, .02);
  vec3 c1 = vec3(1.0, .38, .06);
  vec3 c2 = vec3(1.0, .86, .52);
  return mix(mix(c0, c1, smoothstep(0., .55, t)), c2, smoothstep(.48, 1., t));
}

vec3 blackbodyInk(float t){
  vec3 c0 = vec3(.72, .12, .05);
  vec3 c1 = vec3(.88, .30, .06);
  vec3 c2 = vec3(.96, .52, .12);
  return mix(mix(c0, c1, smoothstep(0., .55, t)), c2, smoothstep(.5, 1., t));
}

float discGlow(vec3 rayO, vec3 V, vec3 C, float rWorld){
  float tc = dot(C - rayO, V);
  vec3 closest = rayO + tc * V;
  float d = length(closest - C);
  float core = exp(-pow(d / (rWorld * 0.68), 2.));
  float halo = exp(-pow(d / (rWorld * 1.42), 2.)) * 0.28;
  return core + halo;
}

float tipVortex(vec3 rayO, vec3 V, vec3 tip, float spd, float drs, float T){
  // Trail extending in -x behind rear wing endplate tips
  float best = 0.;
  for (int i = 0; i < 14; i++) {
    float f = (float(i) + 0.5) / 14.;
    float s = f * 82.;
    float swirl = sin(s * 0.16 - T * (8. + 10. * spd)) * (1.0 + 2.4 * f);
    float drop = -f * 4.2;
    vec3 p = tip + vec3(-s, swirl * 0.45, drop + cos(s * 0.16 - T * (8. + 10. * spd)) * 1.1 * f);
    float tc = dot(p - rayO, V);
    float d = length(rayO + tc * V - p);
    float rad = 1.4 + 4.4 * f;
    float fade = smoothstep(0., 8., s) * (1. - smoothstep(50., 82., s));
    float wisp = 0.65 + 0.35 * sin(s * 0.25 - T * 14.);
    best += exp(-pow(d / rad, 2.)) * fade * wisp;
  }
  float drsDrop = 1. - 0.58 * drs;
  return best * 0.14 * smoothstep(0.28, 0.95, spd) * drsDrop;
}

void main(){
  vec2 vb = viewOf(gl_FragCoord.xy);
  vec3 V = towardViewer();
  vec3 O = rayOf(vb);
  vec3 col = vec3(0.);
  vec3 lCol = vec3(0.);
  float lA = 0.;

  // 1. Carbon-carbon brake thermal glow (seated inside wheel rim & fully exposed on explode!)
  if (uBrakeGlow > .01) {
    float vis = 0.52 + 0.48 * uExplode;
    float gFL = discGlow(O, V, uBrakeFL, 10.8) * 0.72;
    float gFR = discGlow(O, V, uBrakeFR, 10.2) * 0.88;
    float gRL = discGlow(O, V, uBrakeRL, 9.2) * 0.52;
    float gRR = discGlow(O, V, uBrakeRR, 8.8) * 0.74;
    float gTot = (gFL + gFR + gRL + gRR) * uBrakeGlow * vis;
    vec3 bb = blackbody(uBrakeGlow);
    col += bb * gTot * 1.05;
    float aB = clamp(gTot * 0.68, 0., 0.78);
    lCol += blackbodyInk(uBrakeGlow) * aB;
    lA += aB;
  }

  // 2. Volumetric Exhaust Tailpipe Plume (threads cleanly aft between rear-wing endplates)
  if (uExhaust > .01) {
    float exSum = 0.;
    float coreSum = 0.;
    float dith = hash12(gl_FragCoord.xy);
    // Check if ray passes through the near right rear-wing endplate plane (y = 43)
    vec3 epHit = onWallY(vb, 43.);
    float behindEP = (1. - uExplode) * window(epHit.x, -214., -178., 2.5) * window(epHit.z, 31., 76.5, 2.5);
    float epMask = 1. - 0.88 * behindEP;
    for (int i = 0; i < 16; i++) {
      float f = (float(i) + dith) / 16.;
      float s = f * (44. + 24. * uExhaust);
      float turb = (fbm2(vec2(s * 0.085 - uTime * 9.5, f * 3.1 + 4.2)) - 0.5) * (1.6 + 5.2 * f);
      vec3 p = uTailpipe + vec3(-s, turb * 0.45, turb * 0.3 + f * 1.8);
      float tc = dot(p - O, V);
      float d = length(O + tc * V - p);
      float rad = 2.0 + 5.6 * f;
      float env = smoothstep(0., 3.2, s) * (1. - smoothstep(24., 44. + 24. * uExhaust, s));
      exSum += exp(-pow(d / rad, 2.)) * env;
      coreSum += exp(-pow(d / (rad * 0.42), 2.)) * exp(-s / 16.) * env;
    }
    float body = exSum * 0.14 * uExhaust * epMask;
    float core = coreSum * 0.24 * uExhaust * epMask;
    col += vec3(1., .46, .14) * body + vec3(1., .86, .62) * core;
    float aE = clamp((body * 0.55 + core * 0.45), 0., 0.76);
    lCol += mix(vec3(.82, .32, .08), vec3(.96, .58, .18), clamp(core * 2., 0., 1.)) * aE;
    lA += aE;
  }

  // 3. Rear-wing tip vortices (thin out cleanly when DRS opens!)
  float spd = clamp(uSpeed, 0., 1.);
  if (spd > .26) {
    float vL = tipVortex(O, V, uRwTipL, spd, uDrs, uTime);
    float vR = tipVortex(O, V, uRwTipR, spd, uDrs, uTime);
    float vTot = (vL + vR) * (1. - 0.55 * uExplode);
    col += vec3(.62, .84, 1.) * vTot * 0.85;
    float aV = clamp(vTot * 0.62, 0., 0.65);
    lCol += vec3(.14, .42, .74) * aV;
    lA += aV;
  }

  col = tonemap(col, 1.15);
  float m = max(col.r, max(col.g, col.b));
  float n = (hash12(gl_FragCoord.xy + fract(uTime * .53) * 89.) - 0.5) / 255.;
  col = max(col + n * smoothstep(0., 2./255., m), 0.);
  m = max(col.r, max(col.g, col.b));
  vec4 darkOut = vec4(col, m);
  float a = clamp(lA, 0., 0.86);
  vec3 lNorm = a > 1e-4 ? lCol / max(lA, 1e-4) : vec3(0.);
  vec4 lightOut = vec4(lNorm * a, a);
  gl_FragColor = mix(darkOut, lightOut, uLight);
}
`;

const backGL = backCanvas
  ? glLayer({
      canvas: backCanvas,
      fragment: BACK_FRAG,
      view: [D.W, D.H],
      camera: D.camera,
      uniforms: ["uSpeed", "uDrs", "uBrakeGlow", "uExhaust", "uExplode", "uLight", "uBrakeFL", "uBrakeFR", "uBrakeRL", "uBrakeRR", "uTailpipe"],
    })
  : null;

const frontGL = frontCanvas
  ? glLayer({
      canvas: frontCanvas,
      fragment: FRONT_FRAG,
      view: [D.W, D.H],
      camera: D.camera,
      uniforms: ["uSpeed", "uDrs", "uBrakeGlow", "uExhaust", "uExplode", "uLight", "uBrakeFL", "uBrakeFR", "uBrakeRL", "uBrakeRR", "uTailpipe", "uRwTipL", "uRwTipR"],
    })
  : null;

function drawShaders(tel) {
  const light = isLight() ? 1 : 0;
  const spd = clamp(S.speed.x / SPEC.maxSpeedDrsKmh, 0, 1);
  const brakeGlow = clamp((S.brakeTempC - 360) / 660, 0, 1);
  const explodeAvg = (rideState.cover.x + rideState.sidepodR.x + rideState.rearwing.x) / 3;
  const squatUnits = (tel.squatFrontMm * 0.5 + tel.squatRearMm * 0.5) / 12;

  const shiftPt = (pt, rideId, sprung = false) => {
    const sh = worldShiftFor(rideId);
    const dz = sprung ? -squatUnits * (1 - (rideState[rideId]?.x ?? 0)) : 0;
    return [pt[0] + sh[0], pt[1] + sh[1], pt[2] + sh[2] + dz];
  };

  const bFL = shiftPt(D.anchors.brakeFL, "frontCorner", false);
  const bFR = shiftPt(D.anchors.brakeFR, "frontCorner", false);
  const bRL = shiftPt(D.anchors.brakeRL, "gearbox", false);
  const bRR = shiftPt(D.anchors.brakeRR, "gearbox", false);
  const tail = shiftPt(D.anchors.tailpipe, "gearbox", true);
  const rwL = shiftPt(D.anchors.rwTipL, "rearwing", true);
  const rwR = shiftPt(D.anchors.rwTipR, "rearwing", true);

  const active = spd > 0.01 || brakeGlow > 0.01 || S.exhaust.x > 0.01;
  if (!active) {
    if (backGL) backGL.clear();
    if (frontGL) frontGL.clear();
    return;
  }
  const common = {
    uSpeed: spd,
    uDrs: S.drs.x,
    uBrakeGlow: brakeGlow,
    uExhaust: S.exhaust.x,
    uExplode: explodeAvg,
    uLight: light,
    uBrakeFL: bFL,
    uBrakeFR: bFR,
    uBrakeRL: bRL,
    uBrakeRR: bRR,
    uTailpipe: tail,
  };
  if (backGL) backGL.draw(common, clock);
  if (frontGL) frontGL.draw({ ...common, uRwTipL: rwL, uRwTipR: rwR }, clock);
}

function updateTour(dt) {
  if (!touring) return;
  tourTime = (tourTime + dt) % 24.0;
  const t = tourTime;
  if (t < 4.5) {
    setApart(false);
    targetSpeed = 318;
    drsOn = false;
    brakeOn = false;
    steerMode = 0;
  } else if (t < 8.2) {
    setApart(false);
    targetSpeed = 342;
    drsOn = true;
    brakeOn = false;
    steerMode = 0;
  } else if (t < 11.4) {
    setApart(false);
    targetSpeed = 88;
    drsOn = false;
    brakeOn = true;
    steerMode = 0;
  } else if (t < 15.0) {
    setApart(false);
    targetSpeed = 148;
    drsOn = false;
    brakeOn = false;
    steerMode = t < 13.2 ? 1 : -1;
  } else if (t < 21.8) {
    targetSpeed = 0;
    drsOn = false;
    brakeOn = false;
    steerMode = 0;
    setApart(true);
  } else {
    targetSpeed = 0;
    drsOn = false;
    brakeOn = false;
    steerMode = 0;
    setApart(false);
  }
  setBtnState(btnRun, targetSpeed > 20);
  setBtnState(btnDrs, drsOn);
  setBtnState(btnBrake, brakeOn);
  setBtnState(btnSteer, steerMode !== 0);
  if (speedSlider && !manualSpeed) speedSlider.value = String(Math.round(S.speed.x));
}

function tick(now) {
  rafId = 0;
  const dt = lastMs ? Math.min(0.05, (now - lastMs) / 1000) : 1 / 60;
  lastMs = now;
  clock += dt;

  if (!touring && !running && !apart && !brakeOn && !drsOn && steerMode === 0 && !selected && !still.matches) {
    idleTimer += dt;
    if (idleTimer > 14) {
      touring = true;
      tourTime = 0;
      manualSpeed = false;
    }
  } else {
    idleTimer = 0;
  }

  updateTour(dt);

  const calm = still.matches;
  let moving = false;

  // Compute target speed & exhaust load
  let goalSpeed = targetSpeed;
  if (brakeOn && !touring) goalSpeed = Math.max(0, targetSpeed * 0.25);
  const goalDrs = drsOn ? 1 : 0;
  const goalBrake = brakeOn ? 1 : 0;
  const goalSteer = steerMode * 14.5;
  const goalExhaust = goalSpeed > 15 && !brakeOn ? clamp(0.22 + (goalSpeed / 330) * 0.78, 0, 1) : goalSpeed > 5 ? 0.15 : 0;

  if (settle(S.speed, goalSpeed, dt, brakeOn ? 0.42 : 0.95, calm)) moving = true;
  if (settle(S.drs, goalDrs, dt, 0.16, calm)) moving = true;
  if (settle(S.brake, goalBrake, dt, 0.14, calm)) moving = true;
  if (settle(S.steer, goalSteer, dt, 0.22, calm)) moving = true;
  if (settle(S.exhaust, goalExhaust, dt, 0.28, calm)) moving = true;

  // Brake thermal ODE: rapid heating during high-speed braking, convective airflow cooling
  const heatIn = S.brake.x * (0.28 + 0.72 * (S.speed.x / 300)) * 680;
  const coolOut = (S.brakeTempC - SPEC.brakeAmbientC) * (0.22 + 0.55 * (S.speed.x / 320));
  S.brakeTempC = clamp(S.brakeTempC + (heatIn - coolOut) * dt, SPEC.brakeAmbientC, SPEC.brakeMaxC);
  if (Math.abs(S.brakeTempC - SPEC.brakeAmbientC) > 1.5) moving = true;

  // Staggered springs for all assemblies
  for (const id of RIDES) {
    if (stepSpring(rideState[id], dt, calm)) moving = true;
  }

  const tel = telemetry({
    speedKmh: S.speed.x,
    drs: S.drs.x,
    brake: S.brake.x,
    steerDeg: S.steer.x,
    brakeTempC: S.brakeTempC,
  });

  if (S.speed.x > 0.5 && !calm) {
    S.wheelSpin = (S.wheelSpin + tel.wheelOmega * dt * 0.35) % (Math.PI * 2);
    moving = true;
  }

  placeAndRedraw(tel);
  drawShaders(tel);
  updateReadout(tel);

  if (visible && !calm && (moving || touring || S.speed.x > 0.5 || S.exhaust.x > 0.01 || S.brakeTempC > 130)) {
    rafId = requestAnimationFrame(tick);
  } else {
    lastMs = 0;
  }
}

function wake() {
  if (!visible) return;
  if (!rafId) {
    lastMs = 0;
    rafId = requestAnimationFrame(tick);
  }
}

function userAct() {
  touring = false;
  idleTimer = 0;
  wake();
}

// ---------- UI & Keyboard Bindings ----------
if (btnRun) {
  btnRun.addEventListener("click", () => {
    userAct();
    running = !running;
    manualSpeed = false;
    brakeOn = false;
    if (running) {
      setApart(false);
      targetSpeed = drsOn ? 344 : 326;
    } else {
      targetSpeed = 0;
    }
    setBtnState(btnRun, running);
    setBtnState(btnBrake, false);
    if (speedSlider) speedSlider.value = String(Math.round(targetSpeed));
  });
}

if (btnDrs) {
  btnDrs.addEventListener("click", () => {
    userAct();
    drsOn = !drsOn;
    if (running) targetSpeed = drsOn ? 344 : 326;
    setBtnState(btnDrs, drsOn);
  });
}

if (btnBrake) {
  btnBrake.addEventListener("click", () => {
    userAct();
    brakeOn = !brakeOn;
    if (brakeOn) {
      drsOn = false;
      setBtnState(btnDrs, false);
      if (S.speed.x < 180) S.speed.x = 290;
      S.brakeTempC = Math.max(S.brakeTempC, 820);
      setApart(false);
    }
    setBtnState(btnBrake, brakeOn);
  });
}

if (btnSteer) {
  btnSteer.addEventListener("click", () => {
    userAct();
    steerMode = steerMode === 0 ? 1 : steerMode === 1 ? -1 : 0;
    setBtnState(btnSteer, steerMode !== 0);
  });
}

if (btnExplode) {
  btnExplode.addEventListener("click", () => {
    userAct();
    setApart(!apart);
    if (apart) {
      running = false;
      brakeOn = false;
      targetSpeed = 0;
      setBtnState(btnRun, false);
      setBtnState(btnBrake, false);
    }
  });
}

const THEMES = ["dark", "light", "mclaren"];
const THEME_LABEL = { dark: "Dark", light: "Light", mclaren: "Papaya" };
const btnTheme = root.querySelector('[data-kind="theme"]');
function currentTheme() {
  const host = root.closest(".iso") || document.body;
  const t = host.getAttribute("data-theme") || "dark";
  return THEMES.includes(t) ? t : "dark";
}
function syncThemeBtn() {
  if (!btnTheme) return;
  const cur = currentTheme();
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  btnTheme.textContent = THEME_LABEL[next];
  btnTheme.setAttribute("aria-pressed", cur !== "dark" ? "true" : "false");
  btnTheme.title = `Current: ${THEME_LABEL[cur]} — click for ${THEME_LABEL[next]}`;
}
syncThemeBtn();
if (btnTheme) {
  btnTheme.addEventListener("click", () => {
    const host = root.closest(".iso") || document.body;
    const cur = currentTheme();
    const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    if (next === "dark") host.setAttribute("data-theme", "dark");
    else host.setAttribute("data-theme", next);
    syncThemeBtn();
    const tel = telemetry({ speedKmh: S.speed.x, drs: S.drs.x, brake: S.brake.x, steerDeg: S.steer.x, brakeTempC: S.brakeTempC });
    drawShaders(tel);
    wake();
  });
}

if (speedSlider) {
  speedSlider.addEventListener("input", () => {
    userAct();
    manualSpeed = true;
    targetSpeed = Number(speedSlider.value);
    running = targetSpeed > 10;
    brakeOn = false;
    setBtnState(btnRun, running);
    setBtnState(btnBrake, false);
    if (targetSpeed > 20) setApart(false);
  });
}

carGroup.addEventListener("click", (e) => {
  const g = e.target.closest(".it");
  if (!g || g.dataset.piece === "stand") {
    selectPiece(null);
    return;
  }
  userAct();
  const id = g.dataset.piece;
  selectPiece(selected === id ? null : id);
});

partButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    userAct();
    const id = btn.dataset.part;
    selectPiece(selected === id ? null : id);
    if (selected && !apart && ["powerunit", "cooling", "monocoque", "floor"].includes(id)) {
      setApart(true);
    }
  });
});

stage.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "e") { userAct(); setApart(!apart); e.preventDefault(); }
  else if (k === "d") { btnDrs?.click(); e.preventDefault(); }
  else if (k === "b") { btnBrake?.click(); e.preventDefault(); }
  else if (k === "r" || k === " ") { btnRun?.click(); e.preventDefault(); }
  else if (e.key === "ArrowRight") { userAct(); steerMode = 1; setBtnState(btnSteer, true); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { userAct(); steerMode = -1; setBtnState(btnSteer, true); e.preventDefault(); }
  else if (e.key === "Escape") { userAct(); selectPiece(null); setApart(false); steerMode = 0; brakeOn = false; drsOn = false; running = false; targetSpeed = 0; setBtnState(btnRun, false); setBtnState(btnDrs, false); setBtnState(btnBrake, false); setBtnState(btnSteer, false); e.preventDefault(); }
});

// Pause offscreen
if ("IntersectionObserver" in window) {
  new IntersectionObserver((entries) => {
    visible = entries[0]?.isIntersecting ?? true;
    if (visible) wake();
  }, { threshold: 0.05 }).observe(stage);
}

// Deterministic verification hook for Playwright / capture scripts
window.__FC = {
  setPose({ explode = 0, speed = 0, drs = 0, brake = 0, brakeTemp = SPEC.brakeAmbientC, steer = 0, select = null, tour = false, spin = 0 } = {}) {
    touring = tour;
    apart = explode > 0.5;
    setBtnState(btnExplode, apart);
    for (const id of RIDES) {
      rideState[id].x = explode;
      rideState[id].target = explode;
      rideState[id].v = 0;
      rideState[id].pending = null;
    }
    S.speed.x = speed; S.speed.v = 0; targetSpeed = speed;
    S.drs.x = drs; S.drs.v = 0; drsOn = drs > 0.5;
    S.brake.x = brake; S.brake.v = 0; brakeOn = brake > 0.5;
    S.steer.x = steer; S.steer.v = 0; steerMode = Math.sign(steer);
    S.exhaust.x = speed > 20 && brake < 0.3 ? clamp(0.25 + (speed / 330) * 0.75, 0, 1) : 0;
    S.brakeTempC = brakeTemp;
    S.wheelSpin = spin;
    S.lastDynKey = "";
    setBtnState(btnRun, speed > 20);
    setBtnState(btnDrs, drsOn);
    setBtnState(btnBrake, brakeOn);
    setBtnState(btnSteer, Math.abs(steer) > 1);
    if (speedSlider) speedSlider.value = String(Math.round(speed));
    selectPiece(select);
    const tel = telemetry({ speedKmh: S.speed.x, drs: S.drs.x, brake: S.brake.x, steerDeg: S.steer.x, brakeTempC: S.brakeTempC });
    placeAndRedraw(tel);
    drawShaders(tel);
    updateReadout(tel);
  },
  getState: () => ({ speed: S.speed.x, drs: S.drs.x, brake: S.brake.x, brakeTemp: S.brakeTempC, steer: S.steer.x, apart, selected }),
};

// Initial static render + launch tour
const initTel = telemetry({ speedKmh: 0, drs: 0, brake: 0, steerDeg: 0, brakeTempC: SPEC.brakeAmbientC });
placeAndRedraw(initTel);
updateReadout(initTel);
if (!still.matches) wake();
</script></body></html>
